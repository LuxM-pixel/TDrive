<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 100 100">
  <defs>
    <path id="topArc" d="M 16,50 A 34,34 0 0,1 84,50"/>
    <path id="bottomArc" d="M 17,56 A 35,35 0 0,0 83,56"/>
  </defs>

  <!-- TDrive teal: #4F9FAE -->
  <circle cx="50" cy="50" r="45" fill="#FFFFFF" stroke="#4F9FAE" stroke-width="3"/>
  <circle cx="50" cy="50" r="39" fill="none" stroke="#4F9FAE" stroke-width="1.5"/>

  <!-- Inner seal -->
  <circle cx="50" cy="50" r="28" fill="#4F9FAE"/>
  <circle cx="50" cy="50" r="29.5" fill="none" stroke="#4F9FAE" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="27" fill="none" stroke="#FFFFFF" stroke-width="0.9"/>

  <!-- Top text -->
  <text fill="#4F9FAE" font-family="Arial, Helvetica, sans-serif" font-size="5.1" font-weight="700" letter-spacing="0.55">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">QUALITY MANAGEMENT SYSTEM</textPath>
  </text>

  <!-- Side dots -->
  <circle cx="17.5" cy="50" r="1.6" fill="#4F9FAE"/>
  <circle cx="82.5" cy="50" r="1.6" fill="#4F9FAE"/>

  <!-- ISO -->
  <text x="50" y="53" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="-0.5">ISO</text>
  <text x="50" y="61" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="5.8" font-weight="700">9001:2015</text>

  <!-- Stars -->
  <path d="M50 30.3 l0.9 2.1 2.2 0.2-1.7 1.4 0.5 2.1-1.9-1.1-1.9 1.1 0.5-2.1-1.7-1.4 2.2-0.2z" fill="#FFFFFF"/>
  <path d="M50 65.2 l0.9 2.1 2.2 0.2-1.7 1.4 0.5 2.1-1.9-1.1-1.9 1.1 0.5-2.1-1.7-1.4 2.2-0.2z" fill="#FFFFFF"/>

  <!-- Bottom text -->
  <text fill="#4F9FAE" font-family="Arial, Helvetica, sans-serif" font-size="5.5" font-weight="700" letter-spacing="0.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">9001:2015</textPath>
  </text>
</svg>
