<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>بيانات الدفع | TDrive</title>


    <style>

        /* =========================================
           TDrive PAYMENT PAGE
           مستقل تماماً عن ملفات المستودع
           ========================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
        }


        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            background: #f4fcfc;

            color: #1f2937;

            min-height: 100vh;
        }


        /* ===============================
           HEADER
           =============================== */

        .payment-header {
            background: #ffffff;

            padding: 22px 20px;

            text-align: center;

            border-bottom: 1px solid #e0f2f1;
        }


        .payment-header h1 {
            margin: 0 0 5px;

            font-size: 28px;

            color: #00796b;
        }


        .payment-header p {
            margin: 0 0 18px;

            color: #00897b;
        }


        .payment-header nav {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 20px;

            flex-wrap: wrap;
        }


        .payment-header nav a {
            color: #004d40;

            text-decoration: none;

            font-size: 14px;

            font-weight: 500;
        }

        .payment-header nav a:hover {
            color: #00897b;
        }


        /* ===============================
           PAYMENT SECTION
           =============================== */

        #payment {
            width: 100%;

            max-width: 650px;

            margin: 45px auto;

            padding: 0 18px;
        }


        #payment > h2 {
            text-align: center;

            margin: 0 0 25px;

            font-size: 26px;

            color: #004d40;
        }


        /* ===============================
           CARD
           =============================== */

        .payment-card {
            background: #ffffff;

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 8px 30px
                rgba(0, 137, 123, 0.08);

            border: 1px solid #e0f2f1;
        }


        .welcome {
            margin: 0 0 25px;

            line-height: 1.8;
        }


        /* ===============================
           LABEL
           =============================== */

        .payment-card label,
        .bank-label {
            display: block;

            font-weight: 700;

            margin-bottom: 8px;

            font-size: 15px;

            color: #004d40;
        }


        /* ===============================
           COPY BOX
           =============================== */

        .copy-box {
            display: flex;

            gap: 8px;

            margin-bottom: 22px;
        }


        .copy-box input {
            flex: 1;

            min-width: 0;

            height: 48px;

            border: 1px solid #b2dfdb;

            border-radius: 10px;

            padding: 0 12px;

            background: #f4fcfc;

            color: #111827;

            font-size: 14px;

            direction: ltr;

            text-align: left;

            outline: none;

            -webkit-user-select: text;

            user-select: text;
        }

        .copy-box input:focus {
            border-color: #00897b;
            box-shadow: 0 0 0 3px rgba(0, 137, 123, 0.15);
        }


        /* ===============================
           COPY BUTTON
           =============================== */

        .copy-box button {
            border: 0;

            border-radius: 10px;

            min-width: 75px;

            padding: 0 18px;

            background: #00897b;

            color: #ffffff;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            transition:
                transform 0.15s ease,
                background-color 0.15s ease;
        }


        .copy-box button:active {
            transform: scale(0.96);
        }


        .copy-box button:hover {
            background: #00796b;
        }


        /* ===============================
           BANK
           =============================== */

        .payment-card h3 {
            margin: 0 0 22px;

            font-size: 19px;

            color: #00695c;
        }


        /* ===============================
           NOTICE
           =============================== */

        .notice {
            margin: 0 0 20px;

            padding: 13px;

            background: #e0f2f1;

            color: #004d40;

            border-radius: 10px;

            line-height: 1.7;

            border-right: 4px solid #00897b;
        }


        /* ===============================
           WHATSAPP (تم توحيده مع هوية التركواز المائي النظيف)
           =============================== */

        .whatsapp {
            display: block;

            width: 100%;

            padding: 14px;

            background: #00897b;

            color: #ffffff;

            border-radius: 10px;

            text-align: center;

            text-decoration: none;

            font-weight: 700;

            transition: background-color 0.2s ease, transform 0.15s ease;
        }


        .whatsapp:hover {
            background: #00796b;
        }

        .whatsapp:active {
            transform: scale(0.98);
        }


        /* ===============================
           COPY STATUS
           =============================== */

        .copy-status {
            min-height: 24px;

            margin-top: 14px;

            text-align: center;

            font-size: 14px;

            font-weight: 600;

            line-height: 1.6;

            color: #00796b;
        }


        /* ===============================
           MOBILE
           =============================== */

        @media (max-width: 600px) {

            .payment-header {
                padding: 18px 15px;
            }


            .payment-header h1 {
                font-size: 24px;
            }


            .payment-header nav {
                gap: 12px;
            }


            .payment-header nav a {
                font-size: 13px;
            }


            #payment {
                margin: 30px auto;

                padding: 0 15px;
            }


            #payment > h2 {
                font-size: 23px;
            }


            .payment-card {
                padding: 22px 17px;

                border-radius: 15px;
            }


            .copy-box {
                gap: 6px;
            }


            .copy-box input {
                font-size: 12px;
            }


            .copy-box button {
                min-width: 65px;

                padding: 0 12px;
            }

        }

    </style>

</head>


<body>


<header class="payment-header">

    <h1>TDrive</h1>

    <p>تكنولوجيا القيادة</p>


    <nav>

        <a href="index.html">
            الرئيسية
        </a>

        <a href="index.html#program">
            البرنامج
        </a>

        <a href="payment.html">
            بيانات الدفع
        </a>

        <a href="index.html#register">
            التسجيل
        </a>

    </nav>

</header>



<section id="payment">

    <h2>
        بيانات الدفع
    </h2>


    <div class="payment-card">

        <p class="welcome">
            مرحباً عزيزي العميل،
        </p>



        <label for="iban">
            رقم الآيبان
        </label>


        <div class="copy-box">

            <input
                id="iban"
                type="text"
                readonly
                value="SA8715134018966784773544"
                aria-label="رقم الآيبان"
            >


            <button
                type="button"
                id="copyIban"
            >
                نسخ
            </button>

        </div>



        <label for="accountName">
            الاسم
        </label>


        <div class="copy-box">

            <input
                id="accountName"
                type="text"
                readonly
                value="منى أحمد حمود الشمراني"
                aria-label="اسم صاحب الحساب"
            >


            <button
                type="button"
                id="copyName"
            >
                نسخ
            </button>

        </div>



        <p class="bank-label">
            اسم البنك
        </p>


        <h3>
            بنك البلاد
        </h3>



        <p class="notice">
            ❗ يرجى إرسال إيصال التحويل بعد الدفع.
        </p>



        <a
            class="whatsapp"
            target="_blank"
            rel="noopener noreferrer"
            href="https://wa.me/message/VDGPVTYNXF4EP1"
        >
            إرسال إيصال التحويل عبر واتساب
        </a>



        <div
            id="copyStatus"
            class="copy-status"
            aria-live="polite"
        ></div>


    </div>

</section>



<script>

    /* =====================================================
       TDrive Payment
       Copy System
       مستقل تماماً عن app.js
       ===================================================== */


    const ibanInput =
        document.getElementById("iban");


    const nameInput =
        document.getElementById("accountName");


    const copyIbanButton =
        document.getElementById("copyIban");


    const copyNameButton =
        document.getElementById("copyName");


    const status =
        document.getElementById("copyStatus");



    /* =====================================================
       رسالة للمستخدمة
       ===================================================== */

    function showStatus(message) {

        status.textContent = message;

        clearTimeout(window.tdriveCopyTimer);


        window.tdriveCopyTimer =
            setTimeout(function () {

                status.textContent = "";

            }, 3000);

    }



    /* =====================================================
       تحديد النص
       الحل هنا: نشيل readonly مؤقتاً
       لأن iOS Safari مابيسمحش بعمل select()
       على input فيه readonly
       ===================================================== */

    function selectText(input) {

        const wasReadOnly =
            input.hasAttribute("readonly");


        if (wasReadOnly) {

            input.removeAttribute("readonly");

        }


        input.focus();

        input.select();

        input.setSelectionRange(
            0,
            input.value.length
        );


        return wasReadOnly;

    }



    function restoreReadOnly(input, wasReadOnly) {

        if (wasReadOnly) {

            input.setAttribute("readonly", "");

        }

    }



    /* =====================================================
       الطريقة الأولى
       Clipboard API
       ===================================================== */

    async function modernCopy(text) {

        if (
            navigator.clipboard &&
            typeof navigator.clipboard.writeText === "function"
        ) {

            await navigator.clipboard.writeText(text);

            return true;

        }

        return false;

    }



    /* =====================================================
       الطريقة الثانية
       execCommand
       ===================================================== */

    function oldCopy(input) {

        const wasReadOnly =
            selectText(input);


        try {

            const result =
                document.execCommand("copy");


            return result === true;

        } catch (error) {

            return false;

        } finally {

            restoreReadOnly(input, wasReadOnly);

        }

    }



    /* =====================================================
       نسخ البيانات
       ===================================================== */

    async function copyValue(input, successMessage) {

        const text = input.value;


        /*
         * المحاولة الأولى:
         * Clipboard API
         */

        try {

            const copied =
                await modernCopy(text);


            if (copied) {

                showStatus(
                    "تم النسخ بنجاح ✓"
                );

                return;

            }

        } catch (error) {

            console.log(
                "Clipboard API failed:",
                error
            );

        }



        /*
         * المحاولة الثانية:
         * execCommand
         */

        const oldCopied =
            oldCopy(input);


        if (oldCopied) {

            showStatus(
                "تم النسخ بنجاح ✓"
            );

            return;

        }



        /*
         * المحاولة الثالثة:
         * تحديد النص للمستخدمة يدوياً
         */

        selectText(input);


        showStatus(
            "تم تحديد البيانات. اضغطي مطولاً ثم اختاري «نسخ»."
        );

    }



    /* =====================================================
       زر نسخ الآيبان
       ===================================================== */

    copyIbanButton.addEventListener(
        "click",
        function () {

            copyValue(
                ibanInput,
                "تم نسخ رقم الآيبان ✓"
            );

        }
    );



    /* =====================================================
       زر نسخ الاسم
       ===================================================== */

    copyNameButton.addEventListener(
        "click",
        function () {

            copyValue(
                nameInput,
                "تم نسخ الاسم ✓"
            );

        }
    );



    /* =====================================================
       منع ضغط Enter من عمل أي شيء غير ضروري
       ===================================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                const active =
                    document.activeElement;


                if (
                    active === copyIbanButton ||
                    active === copyNameButton
                ) {

                    event.preventDefault();

                }

            }

        }
    );

</script>


</body>

</html>
