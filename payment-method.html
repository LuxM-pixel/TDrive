<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اختيار طريقة الدفع | TDrive</title>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
rel="stylesheet">

<style>

/* =========================
   الإعدادات العامة
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:#f4f7fa;
    padding:20px;
    color:#222;
}

.container{
    max-width:800px;
    margin:auto;
}


/* =========================
   العنوان
========================= */

h2{
    text-align:center;
    font-size:24px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-bottom:25px;
}


/* =========================
   بيانات الحجز
========================= */

.booking-info{
    background:#fff;
    padding:18px 20px;
    border-radius:18px;
    border:1px solid #e4f1f3;
    margin-bottom:25px;
}

.booking-info p{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;

    padding:8px 0;

    border-bottom:1px solid #eee;

    font-size:14px;
}

.booking-info p:last-child{
    border-bottom:none;
}

.booking-info strong{
    color:#555;
    white-space:nowrap;
}

.booking-info span{
    color:#333;
    font-weight:600;
    text-align:left;
}


/* =========================
   طرق الدفع
========================= */

.payment-methods{

    display:grid;

    grid-template-columns:repeat(3, 1fr);

    gap:10px;

    width:100%;

    margin-top:10px;
}


/* =========================
   بطاقات الدفع
========================= */

.payment-methods .card{

    background:#fff;

    border:2px solid #d9f0f4;

    border-radius:18px;

    padding:16px 8px;

    min-width:0;

    min-height:190px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:space-between;

    text-align:center;

    box-shadow:0 4px 15px rgba(0,0,0,.04);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}


.payment-methods .card:hover{

    transform:translateY(-2px);

    box-shadow:0 7px 20px rgba(0,0,0,.08);
}


/* =========================
   الأيقونات
========================= */

.payment-methods .payment-icon{

    width:82px !important;

    height:82px !important;

    object-fit:contain;

    display:block;

    margin:0 auto 8px auto;
}


/* =========================
   رأس البطاقة
========================= */

.payment-methods .card-header{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    width:100%;

    margin:0;
}


/* =========================
   اسم طريقة الدفع
========================= */

.payment-methods .card h3{

    font-size:15px;

    font-weight:700;

    color:#222;

    line-height:1.4;

    white-space:nowrap;
}


/* =========================
   الأزرار
========================= */

.payment-methods .card button{

    background:#6DB7C5;

    color:#fff;

    border:none;

    padding:9px 5px;

    border-radius:9px;

    font-size:11px;

    font-weight:600;

    cursor:pointer;

    width:100%;

    max-width:150px;

    margin-top:10px;

    transition:
        opacity .15s ease,
        transform .1s ease;
}

.payment-methods .card button:hover{

    opacity:.9;
}

.payment-methods .card button:active{

    transform:scale(.97);
}


/* =========================
   Apple Pay - قريباً
========================= */

.payment-methods .coming-soon-btn{

    background:#e8eef0 !important;

    color:#6DB7C5 !important;

    cursor:not-allowed !important;

    opacity:1 !important;
}


/* =========================
   ملاحظة الدفع
========================= */

.note{

    margin-top:25px;

    padding:18px 20px;

    background:#FFF8E6;

    border-radius:15px;

    line-height:1.9;

    font-size:15px;

    border-right:5px solid #E8C15A;

    text-align:right;
}


/* =========================
   الجوال
========================= */

@media (max-width:600px){

    body{
        padding:15px;
    }

    .payment-methods{

        grid-template-columns:repeat(3, 1fr);

        gap:7px;

    }

    .payment-methods .card{

        padding:13px 5px;

        min-height:170px;

        border-radius:15px;

        border-width:1.5px;

    }

    .payment-methods .payment-icon{

        width:68px !important;

        height:68px !important;

        margin-bottom:6px;

    }

    .payment-methods .card h3{

        font-size:11px;

    }

    .payment-methods .card button{

        font-size:9px;

        padding:7px 2px;

        border-radius:7px;

        margin-top:8px;

    }

    .note{

        font-size:13px;

        padding:15px;

    }

}


/* =========================
   الجوال الصغير
========================= */

@media (max-width:380px){

    .payment-methods{

        gap:5px;

    }

    .payment-methods .card{

        padding:11px 3px;

        min-height:155px;

    }

    .payment-methods .payment-icon{

        width:62px !important;

        height:62px !important;

    }

    .payment-methods .card h3{

        font-size:10px;

    }

    .payment-methods .card button{

        font-size:8px;

        padding:6px 2px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     عنوان الصفحة
========================= -->

<h2>
    اختيار طريقة الدفع
</h2>

<p class="subtitle">
    اختاري الطريقة المناسبة لإكمال حجزك.
</p>


<!-- =========================
     بيانات الحجز
========================= -->

<div class="booking-info">

    <p>
        <strong>رقم الحجز:</strong>
        <span id="bookingId"></span>
    </p>

    <p>
        <strong>الاسم:</strong>
        <span id="fullName"></span>
    </p>

    <p>
        <strong>رقم الجوال:</strong>
        <span id="phone"></span>
    </p>

    <p>
        <strong>تاريخ البداية:</strong>
        <span id="trainingDate"></span>
    </p>

    <p>
        <strong>وقت التدريب:</strong>
        <span id="trainingTime"></span>
    </p>

    <p>
        <strong>رسوم البرنامج:</strong>
        <span>375 ريال</span>
    </p>

</div>


<!-- =========================
     طرق الدفع
========================= -->

<div class="payment-methods">


    <!-- =====================
         التحويل البنكي
    ====================== -->

    <div class="card">

        <div class="card-header">

            <img
                class="payment-icon"
                src="7F11FB71-5E3D-450C-A4AC-DC788B4FF81A.png"
                alt="التحويل البنكي">

            <h3>
                التحويل البنكي
            </h3>

        </div>


        <button id="bankBtn">
            متابعة
        </button>

    </div>


    <!-- =====================
         تمارا
    ====================== -->

    <div class="card">

        <div class="card-header">

            <img
                class="payment-icon"
                src="521489E7-4F1B-468D-8B38-79FCF0A5496F.png"
                alt="تمارا">

            <h3>
                تمارا
            </h3>

        </div>


        <button id="tamaraBtn">
            تمارا
        </button>

    </div>


    <!-- =====================
         Apple Pay
    ====================== -->

    <div class="card apple-pay-card">

        <div class="card-header">

            <img
                class="payment-icon"
                src="B9985242-C117-4959-8279-7B443D4540EE.png"
                alt="Apple Pay">

            <h3>
                Apple Pay
            </h3>

        </div>


        <button
            class="coming-soon-btn"
            disabled>

            متوفر قريبًا

        </button>

    </div>


</div>


<!-- =========================
     ملاحظة الدفع
========================= -->

<div class="note">

    💛 بعد الدفع بالتحويل البنكي يرجى إرسال إيصال التحويل عبر الواتساب لتأكيد الحجز.

</div>


</div>



<!-- =========================
     JavaScript
========================= -->

<script type="module">

import {
    saveCustomerInvoice,
    getNextInvoiceNumber,
    getCustomerInvoiceByBookingId
} from "./firebase.js";


/* =========================
   بيانات الحجز
========================= */

const bookingId =
    sessionStorage.getItem("bookingId");

const fullName =
    sessionStorage.getItem("fullName");

const phone =
    sessionStorage.getItem("phone");

const trainingDate =
    sessionStorage.getItem("trainingDate");

const trainingTime =
    sessionStorage.getItem("trainingTime");


/* =========================
   التحقق من وجود الحجز
========================= */

if (!bookingId) {

    alert("لا يوجد حجز مسجل.");

    window.location = "booking.html";

}


/* =========================
   عرض بيانات الحجز
========================= */

document.getElementById("bookingId").textContent =
    bookingId;

document.getElementById("fullName").textContent =
    fullName;

document.getElementById("phone").textContent =
    phone;

document.getElementById("trainingDate").textContent =
    trainingDate;

document.getElementById("trainingTime").textContent =
    trainingTime;


/* =========================
   إنشاء الفاتورة
========================= */

async function createInvoice(paymentMethod){

    const existingInvoice =
        await getCustomerInvoiceByBookingId(
            bookingId
        );


    if(existingInvoice){

        sessionStorage.setItem(
            "invoiceId",
            existingInvoice.invoiceId
        );

        sessionStorage.setItem(
            "paymentMethod",
            paymentMethod
        );

        return;

    }


    const invoiceNumber =
        await getNextInvoiceNumber();


    const year =
        new Date().getFullYear();


    const invoiceId =
        "TDR-" +
        year +
        "-" +
        String(invoiceNumber)
            .padStart(4,"0");


    await saveCustomerInvoice({

        invoiceId,

        bookingId,

        fullName,

        phone,

        trainingDate,

        trainingTime,

        paymentMethod,

        paymentStatus:
            "Pending",

        originalPrice:
            500,

        discount:
            125,

        finalPrice:
            375,

        createdAt:
            new Date().toISOString()

    });


    sessionStorage.setItem(
        "invoiceId",
        invoiceId
    );

    sessionStorage.setItem(
        "paymentMethod",
        paymentMethod
    );

}


/* =========================
   التحويل البنكي
========================= */

document
    .getElementById("bankBtn")
    .addEventListener(
        "click",
        async () => {

            try {

                await createInvoice(
                    "Bank Transfer"
                );

                window.location.href =
                    "payment.html";

            }

            catch(error){

                console.error(error);

                alert(
                    "حدث خطأ: " +
                    error.message
                );

            }

        }
    );


/* =========================
   تمارا
========================= */

document
    .getElementById("tamaraBtn")
    .addEventListener(
        "click",
        async () => {

            try {

                await createInvoice(
                    "Tamara"
                );


                const response =
                    await fetch(

                        "https://t-drive-three.vercel.app/api/create-tamara-order",

                        {

                            method:
                                "POST",

                            headers:{
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    bookingId,

                                    fullName,

                                    phone,

                                    trainingDate,

                                    trainingTime

                                })

                        }

                    );


                const data =
                    await response.json();


                if(!response.ok){

                    throw new Error(
                        data.error?.message ||
                        "فشل إنشاء طلب الدفع"
                    );

                }


                window.location.href =
                    data.checkoutUrl;

            }


            catch(error){

                console.error(error);

                alert(
                    "حدث خطأ: " +
                    error.message
                );

            }

        }
    );

</script>


</body>

</html>
